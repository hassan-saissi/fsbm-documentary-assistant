name: FSBM Assistant CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Récupérer le code source du dépôt
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configurer l'environnement Python
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # Cache les dépendances pip pour accélérer les futurs builds

      # 3. Installer les dépendances du projet
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Vérifier la syntaxe et les imports de l'application
      - name: Verify application syntax
        run: |
          python -c "import ast; ast.parse(open('app.py', encoding='utf-8').read())"
          echo "✅ app.py syntax is valid!"